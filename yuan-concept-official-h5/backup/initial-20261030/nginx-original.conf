# User-approved temporary IP access; HTTPS/WAF are pending formal onboarding.
limit_req_zone $binary_remote_addr zone=daily_health_generate:10m rate=10r/m;
server {
    listen 80;
    server_name 47.119.148.3;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 100s;
    location = /api/generate {
        limit_req zone=daily_health_generate burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18080;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
    }
    access_log /var/log/nginx/daily-heath-station-web.access.log;
    error_log /var/log/nginx/daily-heath-station-web.error.log;
}
